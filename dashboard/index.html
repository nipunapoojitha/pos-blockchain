<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pos-blockchain dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08111f;
        --panel: rgba(12, 22, 40, 0.9);
        --border: rgba(120, 167, 255, 0.18);
        --text: #eef4ff;
        --muted: #97abd0;
        --accent: #6ea8fe;
        --accent-2: #38d39f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(110, 168, 254, 0.22), transparent 35%),
          linear-gradient(180deg, #0a1427 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0 64px;
      }

      .hero,
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 24px;
        backdrop-filter: blur(18px);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
      }

      .hero {
        padding: 32px;
        margin-bottom: 24px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(56, 211, 159, 0.12);
        color: #baf8df;
        font-size: 0.85rem;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: clamp(2rem, 5vw, 3.8rem);
      }

      p {
        color: var(--muted);
        line-height: 1.6;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }

      .stat {
        padding: 20px;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .stat-value {
        margin-top: 10px;
        font-size: 1.8rem;
        font-weight: 700;
      }

      .panel {
        padding: 24px;
        margin-top: 24px;
      }

      .section-title {
        margin: 0 0 18px;
        font-size: 1.1rem;
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .list-item {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
      }

      .pill {
        color: var(--accent-2);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="eyebrow">● Live Web3 telemetry</div>
        <h1>pos-blockchain</h1>
        <p>
          A compact PoS blockchain and DeFi dashboard for validator, liquidity, NFT, and bridge activity.
        </p>
        <div class="grid" id="stats"></div>
      </section>

      <section class="panel">
        <h2 class="section-title">DEX reserves</h2>
        <div class="list" id="dex-reserves"></div>
      </section>

      <section class="panel">
        <h2 class="section-title">Ecosystem modules</h2>
        <div class="list" id="modules"></div>
      </section>
    </main>

    <script>
      const snapshot = {
        chainName: 'pos-blockchain',
        totalSupply: 100,
        circulatingSupply: 60,
        totalStaked: 40,
        blocks: 2,
        pendingTransactions: 0,
        peers: 3,
        nftCount: 1,
        bridgeTransfers: 1,
        dexReserves: {
          POS: 1100,
          USD: 909.34
        }
      };

      const stats = [
        ['Chain', snapshot.chainName],
        ['Total supply', snapshot.totalSupply],
        ['Circulating', snapshot.circulatingSupply],
        ['Total staked', snapshot.totalStaked],
        ['Blocks', snapshot.blocks],
        ['Peers', snapshot.peers]
      ];

      const modules = [
        ['Smart Contract VM', 'JavaScript execution via Node vm'],
        ['AMM DEX', 'Constant-product liquidity pools'],
        ['NFT engine', `${snapshot.nftCount} minted asset(s)`],
        ['Cross-chain bridge', `${snapshot.bridgeTransfers} processed transfer(s)`]
      ];

      document.getElementById('stats').innerHTML = stats
        .map(([label, value]) => `
          <article class="stat panel">
            <div class="stat-label">${label}</div>
            <div class="stat-value">${value}</div>
          </article>
        `)
        .join('');

      document.getElementById('dex-reserves').innerHTML = Object.entries(snapshot.dexReserves)
        .map(([token, amount]) => `
          <div class="list-item">
            <span>${token}</span>
            <strong>${Number(amount).toFixed(2)}</strong>
          </div>
        `)
        .join('');

      document.getElementById('modules').innerHTML = modules
        .map(([name, detail]) => `
          <div class="list-item">
            <span>${name}</span>
            <span class="pill">${detail}</span>
          </div>
        `)
        .join('');
    </script>
  </body>
</html>
